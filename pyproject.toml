[project]
name = "emby-doctor"
version = "1.3.0"
description = "EMBY Doctor desktop and CLI maintenance utilities for Emby media libraries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kesuy"}]
dependencies = ["Pillow>=10.0"]
keywords = ["emby", "media-library", "metadata", "batch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
emby-doctor = "emby_batch:main"
emby-doctor-gui = "emby_gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
