name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows icon from SVG
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          magick -background none assets/emby.svg -define icon:auto-resize=256,128,64,48,40,32,24,20,16 assets/emby.ico
          magick identify assets/emby.ico
      - name: Build GUI EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --icon assets/emby.ico --add-data "assets/emby.png;assets" --name EMBY-Doctor emby_gui.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\EmbyMediaLibraryBatchProcessor.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v6
        with:
          name: EMBY-Doctor-Windows
          path: dist/EMBY-Doctor.exe
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: EMBY-Doctor-Windows
          path: release-assets
      - name: Prepare release assets
        run: |
          mkdir out
          cp release-assets/EMBY-Doctor.exe out/EMBY-Doctor-Windows.exe
          sha256sum out/* > out/SHA256SUMS.txt
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME#release/}" >> "${GITHUB_ENV}"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "EMBY Doctor ${RELEASE_TAG}" \
            --generate-notes
