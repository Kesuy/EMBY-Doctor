name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build GUI EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --name EmbyMediaLibraryBatchProcessor emby_gui.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\EmbyMediaLibraryBatchProcessor.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: EmbyMediaLibraryBatchProcessor-Windows
          path: dist/EmbyMediaLibraryBatchProcessor.exe
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EmbyMediaLibraryBatchProcessor-Windows
          path: release-assets
      - name: Prepare release assets
        run: |
          mkdir out
          cp release-assets/EmbyMediaLibraryBatchProcessor.exe out/EmbyMediaLibraryBatchProcessor-Windows.exe
          sha256sum out/* > out/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Emby Media Library Batch Processor ${GITHUB_REF_NAME}" \
            --generate-notes
