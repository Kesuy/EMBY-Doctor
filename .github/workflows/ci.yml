name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install Pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python emby_batch.py --version
      - name: GUI entry smoke test
        run: python emby_gui.py --version

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller Pillow
      - name: Build Windows icon from SVG
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          magick -background none assets/emby.svg -define icon:auto-resize=256,128,64,48,40,32,24,20,16 assets/emby.ico
          magick identify assets/emby.ico
      - name: Build GUI EXE
        run: pyinstaller --clean --noconfirm --onefile --windowed --icon assets/emby.ico --add-data "assets/emby.png;assets" --name EMBY-Doctor emby_gui.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\EMBY-Doctor.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: EMBY-Doctor-Windows
          path: dist/EMBY-Doctor.exe
          if-no-files-found: error
